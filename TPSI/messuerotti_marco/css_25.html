<!DOCTYPE html>
<html lang="it">
<head>
    <title>Esercizio CSS 25 - Float</title>
    <link rel="stylesheet" href="css25.css">
</head>
<body>

    <div class="container">
        <div class="box box-left">One</div>

        <div class="box box-right">Two</div>

        <p class="content-text">
            The two boxes should float to either side of this text.
        </p>
        
        <div style="clear: both;"></div>
    </div>

</body>
</html>
